name: Manual live acceptance
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [general, use-cases]
        default: general
        required: true
      provider:
        type: choice
        options: [jev-openrouter, openai-decisions, sage]
        required: true
      model:
        description: Explicit model ID (required for Sage, e.g. levanto-sage-v1.4)
        required: false
        default: ''
      budget_usd:
        description: Total reserved allowance, at most US$5
        default: '1'
        required: true
      rates_json:
        description: Reviewed rates JSON for the selected provider (source, checked_at, input_per_million, output_per_million)
        required: true
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/verify.py
      - name: Prepare reviewed rates
        env:
          REVIEWED_RATES_JSON: ${{ inputs.rates_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          rates = json.loads(os.environ["REVIEWED_RATES_JSON"])
          Path("reports/rates.json").write_text(json.dumps(rates) + "\n")
          PY
      - name: Evaluate frozen core fixtures
        if: inputs.suite == 'general'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
          TEST_PROVIDER: ${{ inputs.provider }}
          TEST_BUDGET: ${{ inputs.budget_usd }}
          TEST_MODEL: ${{ inputs.model }}
        run: |
          model_args=()
          if [ -n "$TEST_MODEL" ]; then model_args=(--model "$TEST_MODEL"); fi
          python -m decision_models evaluate --repo . --mode live --providers "$TEST_PROVIDER" --budget "$TEST_BUDGET" --rates reports/rates.json --output reports/manual-live.json "${model_args[@]}"
      - name: Evaluate frozen use cases
        if: inputs.suite == 'use-cases'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
          TEST_PROVIDER: ${{ inputs.provider }}
          TEST_BUDGET: ${{ inputs.budget_usd }}
          TEST_MODEL: ${{ inputs.model }}
        run: |
          model_args=()
          if [ -n "$TEST_MODEL" ]; then model_args=(--model "$TEST_MODEL"); fi
          python -m decision_models evaluate-use-cases --repo . --mode live --providers "$TEST_PROVIDER" --budget "$TEST_BUDGET" --rates reports/rates.json --output reports/manual-use-cases.json "${model_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-live-receipts
          path: |
            reports/manual-live.json
            reports/manual-use-cases.json
            reports/manual-use-cases.jsonl
            reports/manual-use-cases.md
