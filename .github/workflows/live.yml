name: Manual live acceptance
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [core, recipes]
        default: core
        required: true
      provider:
        type: choice
        options: [jev-openrouter, openai-decisions, sage]
        required: true
      budget_usd:
        description: Total reserved allowance, at most US$5
        default: '1'
        required: true
      rates_json:
        description: Reviewed rates JSON for the selected provider (source, checked_at, input_per_million, output_per_million)
        required: true
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/verify.py
      - name: Prepare reviewed rates
        env:
          REVIEWED_RATES_JSON: ${{ inputs.rates_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          rates = json.loads(os.environ["REVIEWED_RATES_JSON"])
          Path("reports/rates.json").write_text(json.dumps(rates) + "\n")
          PY
      - name: Evaluate frozen core fixtures
        if: inputs.suite == 'core'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
          TEST_PROVIDER: ${{ inputs.provider }}
          TEST_BUDGET: ${{ inputs.budget_usd }}
        run: decision-models evaluate --repo . --mode live --providers "$TEST_PROVIDER" --budget "$TEST_BUDGET" --rates reports/rates.json --output reports/manual-live.json
      - name: Evaluate frozen community recipes
        if: inputs.suite == 'recipes'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
          TEST_PROVIDER: ${{ inputs.provider }}
          TEST_BUDGET: ${{ inputs.budget_usd }}
        run: decision-models evaluate-recipes --repo . --mode live --providers "$TEST_PROVIDER" --budget "$TEST_BUDGET" --rates reports/rates.json --output reports/manual-recipes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-live-receipts
          path: |
            reports/manual-live.json
            reports/manual-recipes.json
            reports/manual-recipes.jsonl
            reports/manual-recipes.md
