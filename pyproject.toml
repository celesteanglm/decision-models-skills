[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-models-skills"
version = "0.1.0"
description = "Optional Python reference implementation for model-agnostic decision skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/celesteanglm/decision-models-skills"

[tool.setuptools.packages.find]
where = ["src"]
